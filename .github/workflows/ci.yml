name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_DATABASE_URL: postgres://a5:a5_dev_password@127.0.0.1:5432/postgres
  TEST_REDIS_URL: redis://127.0.0.1:6379

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: a5
          POSTGRES_PASSWORD: a5_dev_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U a5" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # Every service suite creates throw-away databases and pools; cap parallelism so the default
      # 100-connection PostgreSQL limit is not exhausted.
      - run: pnpm test --concurrency=3
      - run: pnpm build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high

  images:
    name: Container images
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      matrix:
        app:
          [
            gateway,
            identity-service,
            learning-service,
            media-service,
            assessment-service,
            ai-coaching-service,
            certification-service,
            notification-service,
            analytics-service,
            audit-service,
          ]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/service.Dockerfile
          build-args: |
            APP=${{ matrix.app }}
            WITH_FFMPEG=${{ matrix.app == 'media-service' }}
          push: false
          tags: a5-academy/${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
